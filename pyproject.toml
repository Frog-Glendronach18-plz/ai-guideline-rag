[project]
name = "ai-guideline-rag"
version = "0.1.0"
description = "AI事業者ガイドラインに版・ページの出典付きで答えるRAG Q&A（LangChain学習用デモ）"
readme = "README.md"
authors = [
    { name = "Frog-Glendronach18-plz", email = "76939679+Frog-Glendronach18-plz@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gradio>=6.29.1",
    "langchain>=1.4.3",
    "langchain-anthropic>=1.7.5",
    "langchain-cloudflare>=0.4.1",
    "langchain-community>=0.4.2",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.3",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
